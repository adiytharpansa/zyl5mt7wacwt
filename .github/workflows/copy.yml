name: Copy Title
on:
  workflow_dispatch:
    inputs:
      wid: { description: "ID gudang judul", required: true }
      slug_id: { description: "slugId anidap", required: true }
      anilist_id: { description: "ID AniList", required: true }
      total_eps: { description: "Jumlah episode", required: true }
      title_name: { description: "Nama judul", required: true }
permissions:
  contents: write
concurrency:
  group: copy-title
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Salin judul ke repo ini
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WID: ${{ inputs.wid }}
          SLUG_ID: ${{ inputs.slug_id }}
          ANILIST_ID: ${{ inputs.anilist_id }}
          TOTAL_EPS: ${{ inputs.total_eps }}
          TITLE_NAME: ${{ inputs.title_name }}
        run: |
          mkdir -p tools_dl
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/${{ github.repository }}/contents/tools/copy_title.py" -o tools_dl/copy_title.py || true
          ls -la tools_dl
          grep -m1 "v5.6 (5 Nov 2026" tools_dl/copy_title.py || echo "PERINGATAN: skrip yang terambil BUKAN v5.5"
          python3 -m pip install --quiet ctranslate2 subword-nmt || echo "PERINGATAN: paket terjemahan gagal dipasang"
          mkdir -p argos-model && curl -sL --max-time 600 "https://argos-net.com/v1/translate-en_id-1_9.argosmodel" -o argos-model/model.argosmodel && (cd argos-model && python3 -c "import zipfile; zipfile.ZipFile('model.argosmodel').extractall('.')") || echo "PERINGATAN: model terjemahan gagal diunduh"
          python3 tools_dl/copy_title.py
